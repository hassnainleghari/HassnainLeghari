<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 170" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Soft Apple Shadow -->
    <filter id="apple-card-shadow" x="-10%" y="-15%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>

    <filter id="squircle-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.1" />
    </filter>
  </defs>

  <style>
    .f-apple { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .dock-label {
      font-size: 11px;
      font-weight: 600;
      fill: #334155;
      text-anchor: middle;
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    .p-beacon {
      animation: pulse-dot 2s infinite ease-in-out;
      transform-box: fill-box;
      transform-origin: center;
    }
  </style>

  <!-- ================= TOP CATEGORY PILLS ================= -->
  <g transform="translate(130, 10)">
    <!-- Pill 1: Automation -->
    <g transform="translate(0, 0)">
      <rect width="140" height="26" rx="13" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2" />
      <circle cx="14" cy="13" r="3.5" fill="#2563eb" class="p-beacon" />
      <text x="24" y="17" class="f-apple" font-size="11.5" font-weight="700" fill="#2563eb">⚡ Automation</text>
    </g>

    <!-- Pill 2: Web Architecture -->
    <g transform="translate(155, 0)">
      <rect width="160" height="26" rx="13" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" />
      <circle cx="14" cy="13" r="3.5" fill="#0284c7" />
      <text x="24" y="17" class="f-apple" font-size="11.5" font-weight="600" fill="#334155">🌐 Web Architecture</text>
    </g>

    <!-- Pill 3: Android & Mobile -->
    <g transform="translate(330, 0)">
      <rect width="165" height="26" rx="13" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" />
      <circle cx="14" cy="13" r="3.5" fill="#7c3aed" />
      <text x="24" y="17" class="f-apple" font-size="11.5" font-weight="600" fill="#334155">📱 Android &amp; Mobile</text>
    </g>

    <!-- Pill 4: DevOps & Cloud -->
    <g transform="translate(510, 0)">
      <rect width="160" height="26" rx="13" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" />
      <circle cx="14" cy="13" r="3.5" fill="#0f172a" />
      <text x="24" y="17" class="f-apple" font-size="11.5" font-weight="600" fill="#334155">🛠️ DevOps &amp; Cloud</text>
    </g>
  </g>

  <!-- ================= APPLE MACOS DOCK BASE ================= -->
  <g transform="translate(20, 50)">
    <!-- White Glass Dock Background -->
    <rect width="920" height="102" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" filter="url(#apple-card-shadow)" />

    <!-- ================= 10 PRECISELY POSITIONED SQUIRCLE ICONS ================= -->
    <!-- Native SVG SMIL animateTransform keeps X fixed and smoothly floats Y -->

    <!-- 1. PYTHON (X = 30) -->
    <g transform="translate(30, 14)">
      <animateTransform attributeName="transform" type="translate" values="30 14; 30 8; 30 14" dur="4s" repeatCount="indefinite" />
      <rect width="56" height="56" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" filter="url(#squircle-shadow)" />
      <g transform="translate(13, 13)">
        <path d="M14.5 1 C7.5 1 8 4 8 4 L8 7 L15 7 L15 8 L5 8 C5 8 1 7.5 1 14.5 C1 21.5 4.5 21 4.5 21 L7 21 L7 18 C7 18 6.7 14.5 10.3 14.5 L17.2 14.5 C17.2 14.5 20.5 14.5 20.5 11.2 L20.5 4.5 C20.5 4.5 21 1 14.5 1 Z M11.5 3 C12.3 3 13 3.7 13 4.5 C13 5.3 12.3 6 11.5 6 C10.7 6 10 5.3 10 4.5 C10 3.7 10.7 3 11.5 3 Z" fill="#387eb8"/>
        <path d="M15.5 29 C22.5 29 22 26 22 26 L22 23 L15 23 L15 22 L25 22 C25 22 29 22.5 29 15.5 C29 8.5 25.5 9 25.5 9 L23 9 L23 12 C23 12 23.3 15.5 19.7 15.5 L12.8 15.5 C12.8 15.5 9.5 15.5 9.5 18.8 L9.5 25.5 C9.5 25.5 9 29 15.5 29 Z M18.5 27 C17.7 27 17 26.3 17 25.5 C17 24.7 17.7 24 18.5 24 C19.3 24 20 24.7 20 25.5 C20 26.3 19.3 27 18.5 27 Z" fill="#ffe052"/>
      </g>
      <text x="28" y="75" class="f-apple dock-label">Python</text>
    </g>

    <!-- 2. n8n (X = 120) -->
    <g transform="translate(120, 14)">
      <animateTransform attributeName="transform" type="translate" values="120 14; 120 7; 120 14" dur="4.4s" repeatCount="indefinite" />
      <rect width="56" height="56" rx="14" fill="#fff7ed" stroke="#fed7aa" stroke-width="1" filter="url(#squircle-shadow)" />
      <g transform="translate(13, 14)">
        <circle cx="6" cy="14" r="5" fill="#ea580c"/>
        <circle cx="24" cy="6" r="4.5" fill="#ea580c"/>
        <circle cx="24" cy="22" r="4.5" fill="#ea580c"/>
        <line x1="10" y1="12" x2="20" y2="8" stroke="#ea580c" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="10" y1="16" x2="20" y2="20" stroke="#ea580c" stroke-width="2.5" stroke-linecap="round"/>
      </g>
      <text x="28" y="75" class="f-apple dock-label">n8n Flows</text>
    </g>

    <!-- 3. NEXT.JS (X = 210) -->
    <g transform="translate(210, 14)">
      <animateTransform attributeName="transform" type="translate" values="210 14; 210 9; 210 14" dur="3.8s" repeatCount="indefinite" />
      <rect width="56" height="56" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1" filter="url(#squircle-shadow)" />
      <g transform="translate(14, 14)">
        <circle cx="14" cy="14" r="13" fill="#000000" stroke="#334155" stroke-width="1"/>
        <path d="M19 8 L19 20 M9 8 L9 20 L21 21" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="28" y="75" class="f-apple dock-label">Next.js</text>
    </g>

    <!-- 4. REACT (X = 300) -->
    <g transform="translate(300, 14)">
      <animateTransform attributeName="transform" type="translate" values="300 14; 300 7.5; 300 14" dur="4.2s" repeatCount="indefinite" />
      <rect width="56" height="56" rx="14" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1" filter="url(#squircle-shadow)" />
      <g transform="translate(14, 14)">
        <circle cx="14" cy="14" r="3" fill="#0284c7"/>
        <ellipse cx="14" cy="14" rx="13" ry="5" fill="none" stroke="#0284c7" stroke-width="1.6" />
        <ellipse cx="14" cy="14" rx="13" ry="5" fill="none" stroke="#0284c7" stroke-width="1.6" transform="rotate(60 14 14)" />
        <ellipse cx="14" cy="14" rx="13" ry="5" fill="none" stroke="#0284c7" stroke-width="1.6" transform="rotate(120 14 14)" />
      </g>
      <text x="28" y="75" class="f-apple dock-label">React</text>
    </g>

    <!-- 5. TYPESCRIPT (X = 390) -->
    <g transform="translate(390, 14)">
      <animateTransform attributeName="transform" type="translate" values="390 14; 390 8.5; 390 14" dur="4.6s" repeatCount="indefinite" />
      <rect width="56" height="56" rx="14" fill="#2563eb" stroke="#1d4ed8" stroke-width="1" filter="url(#squircle-shadow)" />
      <text x="14" y="38" class="f-apple" font-size="24" font-weight="800" fill="#ffffff" letter-spacing="-1">TS</text>
      <text x="28" y="75" class="f-apple dock-label">TypeScript</text>
    </g>

    <!-- 6. TAILWIND (X = 480) -->
    <g transform="translate(480, 14)">
      <animateTransform attributeName="transform" type="translate" values="480 14; 480 8; 480 14" dur="4.1s" repeatCount="indefinite" />
      <rect width="56" height="56" rx="14" fill="#ecfeff" stroke="#a5f3fc" stroke-width="1" filter="url(#squircle-shadow)" />
      <g transform="translate(14, 17)">
        <path d="M7 6.5C8.5 3.5 11 2 14.5 2C19.7 2 20.8 6 23 7.5C24.5 8.5 26 9 28 9C26.5 12 24 13.5 20.5 13.5C15.3 13.5 14.2 9.5 12 8C10.5 7 9 6.5 7 6.5ZM0 15.5C1.5 12.5 4 11 7.5 11C12.7 11 13.8 15 16 16.5C17.5 17.5 19 18 21 18C19.5 21 17 22.5 13.5 22.5C8.3 22.5 7.2 18.5 5 17C3.5 16 2 15.5 0 15.5Z" fill="#06b6d4"/>
      </g>
      <text x="28" y="75" class="f-apple dock-label">Tailwind</text>
    </g>

    <!-- 7. KOTLIN (X = 570) -->
    <g transform="translate(570, 14)">
      <animateTransform attributeName="transform" type="translate" values="570 14; 570 7.5; 570 14" dur="4.3s" repeatCount="indefinite" />
      <rect width="56" height="56" rx="14" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1" filter="url(#squircle-shadow)" />
      <g transform="translate(15, 15)">
        <path d="M26 26 L13 26 L20 19 L26 26 Z" fill="#c084fc"/>
        <path d="M0 26 L13 13 L0 0 Z" fill="#7c3aed"/>
        <path d="M0 0 L13 0 L26 13 L13 26 L0 26 Z" fill="#a855f7" fill-opacity="0.85"/>
      </g>
      <text x="28" y="75" class="f-apple dock-label">Kotlin</text>
    </g>

    <!-- 8. FLUTTER (X = 660) -->
    <g transform="translate(660, 14)">
      <animateTransform attributeName="transform" type="translate" values="660 14; 660 9; 660 14" dur="4.5s" repeatCount="indefinite" />
      <rect width="56" height="56" rx="14" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1" filter="url(#squircle-shadow)" />
      <g transform="translate(15, 14)">
        <path d="M16 0 L0 16 L5 21 L26 0 Z" fill="#38bdf8"/>
        <path d="M11 17 L6 22 L11 27 L16 27 L11 22 Z" fill="#0284c7"/>
        <path d="M26 12 L14 24 L19 29 L26 22 Z" fill="#0369a1"/>
      </g>
      <text x="28" y="75" class="f-apple dock-label">Flutter</text>
    </g>

    <!-- 9. ANDROID (X = 750) -->
    <g transform="translate(750, 14)">
      <animateTransform attributeName="transform" type="translate" values="750 14; 750 8; 750 14" dur="3.9s" repeatCount="indefinite" />
      <rect width="56" height="56" rx="14" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1" filter="url(#squircle-shadow)" />
      <g transform="translate(14, 15)">
        <line x1="7" y1="4" x2="4" y2="0" stroke="#16a34a" stroke-width="2" stroke-linecap="round"/>
        <line x1="21" y1="4" x2="24" y2="0" stroke="#16a34a" stroke-width="2" stroke-linecap="round"/>
        <path d="M3 15 C3 8 7 4 14 4 C21 4 25 8 25 15 Z" fill="#16a34a"/>
        <circle cx="8" cy="10" r="1.5" fill="#ffffff"/>
        <circle cx="20" cy="10" r="1.5" fill="#ffffff"/>
        <rect x="3" y="17" width="22" height="10" rx="3" fill="#16a34a"/>
      </g>
      <text x="28" y="75" class="f-apple dock-label">Android</text>
    </g>

    <!-- 10. SUPABASE (X = 840) -->
    <g transform="translate(840, 14)">
      <animateTransform attributeName="transform" type="translate" values="840 14; 840 7; 840 14" dur="4.2s" repeatCount="indefinite" />
      <rect width="56" height="56" rx="14" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1" filter="url(#squircle-shadow)" />
      <g transform="translate(15, 14)">
        <path d="M15 0 L0 18 L13 18 L10 29 L26 11 L13 11 Z" fill="#10b981"/>
      </g>
      <text x="28" y="75" class="f-apple dock-label">Supabase</text>
    </g>

  </g>
</svg>
